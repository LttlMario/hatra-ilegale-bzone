<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghid Hărți & Locații Importante - Familia Es Todo</title>
    <!-- Leaflet CSS for Pan & Zoom map engine -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        /* ==========================================
           CSS CONFIGURATION & THEME VARIABLES
           ========================================== */
        :root {
            --bg-main: #0b1220;
            --bg-panel: #131c2b;
            --bg-panel-hover: #1c283f;
            --accent: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.3);
            --danger: #ff5555;
            --success: #46d369;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-radius: 12px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-panel: #ffffff;
            --bg-panel-hover: #e2e8f0;
            --accent: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.2);
            --danger: #dc2626;
            --success: #16a34a;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-main);
            color: var(--text-main);
        }

        /* ==========================================
           LAYOUT & VIEWPORT STRUCTURE
           ========================================== */
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-rows: 70px 1fr;
            grid-template-columns: 1fr;
        }

        /* Top Bar */
        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 20px;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo-text-group h1 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .logo-text-group h2 {
            font-size: 16px;
            font-weight: 700;
        }

        .controls-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Search Box */
        .search-container {
            position: relative;
            width: 280px;
        }

        .search-container input {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 10px 15px 10px 38px;
            border-radius: var(--border-radius);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        .search-container input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .search-results {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 100%;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            max-height: 350px;
            overflow-y: auto;
            display: none;
            z-index: 1100;
            box-shadow: var(--shadow);
        }

        .search-result-item {
            padding: 10px 15px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition);
        }

        .search-result-item:hover {
            background: var(--bg-panel-hover);
            color: var(--accent);
        }

        /* Buttons */
        .btn {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 9px 16px;
            border-radius: var(--border-radius);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn:hover {
            border-color: var(--accent);
            background: var(--bg-panel-hover);
        }

        .btn-primary {
            background: var(--accent);
            color: #0b1220;
            border: none;
        }

        .btn-primary:hover {
            opacity: 0.9;
            background: var(--accent);
        }

        /* Map Viewport Wrapper */
        #map-container-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .map-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease-in-out;
        }

        .map-view.active {
            opacity: 1;
            pointer-events: auto;
        }

        .leaflet-container {
            width: 100%;
            height: 100%;
            background: var(--bg-main) !important;
        }

        /* ==========================================
           FILTERS PANEL
           ========================================== */
        .filters-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 15px;
            z-index: 900;
            width: 240px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
        }

        .filters-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .filter-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 8px;
            transition: var(--transition);
        }

        .filter-item:hover {
            background: var(--bg-panel-hover);
        }

        .filter-checkbox {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* ==========================================
           MARKER & CUSTOM PULSE STYLING
           ========================================== */
        .custom-marker {
            position: relative;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-panel);
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 15px var(--accent-glow);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .custom-marker:hover {
            transform: scale(1.2);
            z-index: 1000 !important;
        }

        .custom-marker.selected {
            transform: scale(1.35);
            border-color: var(--success);
            box-shadow: 0 0 25px rgba(70, 211, 105, 0.5);
            z-index: 1001 !important;
        }

        /* ==========================================
           RIGHT SIDEBAR & GALLERY
           ========================================== */
        .sidebar {
            position: absolute;
            top: 0;
            right: -420px;
            width: 400px;
            height: 100%;
            background: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            z-index: 1005;
            box-shadow: var(--shadow);
            transition: right 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(12px);
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .sidebar-title-group h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .sidebar-category-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
        }

        .sidebar-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .icon-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .icon-btn.favorited {
            color: var(--danger);
            border-color: var(--danger);
        }

        .sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Gallery Styling */
        .gallery-container {
            position: relative;
            width: 100%;
            height: 220px;
            border-radius: var(--border-radius);
            overflow: hidden;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .gallery-slide {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .gallery-slide.active {
            display: block;
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(11, 18, 32, 0.7);
            border: 1px solid var(--border-color);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .gallery-nav:hover {
            background: var(--accent);
            color: #0b1220;
        }

        .gallery-prev { left: 10px; }
        .gallery-next { right: 10px; }

        .gallery-counter {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(11, 18, 32, 0.8);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        /* Content Blocks */
        .info-block h4 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .info-block p {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-main);
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        /* Image Lightbox Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 3000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .modal-content img {
            width: 100%;
            height: auto;
            max-height: 85vh;
            object-fit: contain;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
        }

        .close-modal {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
        }

        .close-modal:hover {
            color: var(--accent);
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-panel);
            border: 1px solid var(--accent);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: var(--border-radius);
            font-size: 13px;
            font-weight: 600;
            box-shadow: var(--shadow);
            animation: fadeInOut 2.5s ease forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .filters-panel {
                top: 10px;
                left: 10px;
                width: calc(100% - 20px);
                max-height: 160px;
                overflow-y: auto;
            }
            .sidebar {
                width: 100%;
                right: -100%;
                height: 75vh;
                top: auto;
                bottom: 0;
                border-left: none;
                border-top: 1px solid var(--border-color);
                border-radius: 20px 20px 0 0;
                transition: bottom 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            }
            .sidebar.open {
                right: 0;
                bottom: 0;
            }
            .search-container {
                display: none;
            }
        }
    </style>
</head>

            <!-- Right Sidebar -->
            <div class="sidebar" id="sidebar">

                    <div class="sidebar-title-group">
                        <span class="sidebar-category-badge" id="sb-category">Livrare</span>

                    </div>
                    <div class="info-block">
                        <h4>Recompense / Detalii</h4>
                        <p id="sb-rewards">Standard</p>
                    </div>
                    <div class="info-block">
                        <h4>Note</h4>
                        <p id="sb-notes">Informații suplimentare.</p>
                    </div>
                    <div class="meta-row">
                        <span id="sb-updated">Modificat: 2026-07-25</span>
                        <span style="color: var(--accent); font-weight: 600;">by Little Mario</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal for Images -->
    <div class="modal" id="imageModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <img id="modalImg" src="" alt="Imagine Mărită">
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

        /* ==========================================
           APPLICATION STATE & PERSISTENCE
           ========================================== */
        let state = {
            currentMap: localStorage.getItem('gta_guide_last_map') || 'ls',
            activeFilters: Object.keys(CONFIG.categories),
            favorites: JSON.parse(localStorage.getItem('gta_guide_favorites')) || [],
            selectedLocationId: null,
            theme: localStorage.getItem('gta_guide_theme') || 'dark'
        };

        let maps = {};
        let markerLayers = {};
        let activeGalleryIndex = 0;
        let currentSelectedLocation = null;

        /* ==========================================
           MAP ENGINE INITIALIZATION (Leaflet CRS.Simple)
           ========================================== */
        function initMaps() {
            document.documentElement.setAttribute('data-theme', state.theme);

            // Los Santos Map
            const lsConfig = CONFIG.maps.ls;
            maps.ls = L.map('map-ls', {
                crs: L.CRS.Simple,
                minZoom: -3,
                maxZoom: 3,
                zoomSnap: 0.5,
                zoomDelta: 0.5,
                attributionControl: false
            });
            const lsBounds = [[0, 0], [lsConfig.height, lsConfig.width]];
            L.imageOverlay(lsConfig.image, lsBounds).addTo(maps.ls);
            maps.ls.fitBounds(lsBounds);
            maps.ls.setZoom(-1);

            // Cayo Perico Map
            const cayoConfig = CONFIG.maps.cayo;
            maps.cayo = L.map('map-cayo', {
                crs: L.CRS.Simple,
                minZoom: -3,
                maxZoom: 3,
                zoomSnap: 0.5,
                zoomDelta: 0.5,
                attributionControl: false
            });
            const cayoBounds = [[0, 0], [cayoConfig.height, cayoConfig.width]];
            L.imageOverlay(cayoConfig.image, cayoBounds).addTo(maps.cayo);
            maps.cayo.fitBounds(cayoBounds);
            maps.cayo.setZoom(-1);

            markerLayers.ls = L.layerGroup().addTo(maps.ls);
            markerLayers.cayo = L.layerGroup().addTo(maps.cayo);

            renderMarkers();
            setupFiltersUI();
            setupEventListeners();
            checkUrlHashOnLoad();

            // Set initial active map view properly
            if (state.currentMap === 'cayo') {
                document.getElementById('map-ls-view').classList.remove('active');
                document.getElementById('map-cayo-view').classList.add('active');
                document.getElementById('map-switch-btn').textContent = 'Schimbă pe Los Santos';
                setTimeout(() => maps.cayo.invalidateSize(), 200);
            }
        }

        /* ==========================================
           MARKER ENGINE & DYNAMIC GENERATION
           ========================================== */
        function renderMarkers() {
            markerLayers.ls.clearLayers();
            markerLayers.cayo.clearLayers();

            DATA.forEach(loc => {
                if (!state.activeFilters.includes(loc.category)) return;

                const catInfo = CONFIG.categories[loc.category];
                if (!catInfo) return;

                const mapCfg = CONFIG.maps[loc.map];
                const lat = mapCfg.height - (loc.y / 100) * mapCfg.height;
                const lng = (loc.x / 100) * mapCfg.width;

                const markerHtml = `
                    <div class="custom-marker" style="border-color: ${catInfo.color}; color: ${catInfo.color};" title="${loc.title}">
                        <span>${catInfo.icon}</span>
                    </div>
                `;

                const customIcon = L.divIcon({
                    className: 'leaflet-custom-div-icon',
                    html: markerHtml,
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });

                const marker = L.marker([lat, lng], { icon: customIcon });

                marker.on('click', () => {
                    selectLocation(loc.id);
                });

                if (loc.map === 'ls') {
                    markerLayers.ls.addLayer(marker);
                } else if (loc.map === 'cayo') {
                    markerLayers.cayo.addLayer(marker);
                }
            });
        }

        /* ==========================================
           FILTERS UI & INTERACTION
           ========================================== */
        function setupFiltersUI() {
            const filterListEl = document.getElementById('filter-list');
            filterListEl.innerHTML = '';

            Object.entries(CONFIG.categories).forEach(([key, cat]) => {
                const isChecked = state.activeFilters.includes(key);
                const div = document.createElement('label');
                div.className = 'filter-item';
                div.innerHTML = `
                    <input type="checkbox" class="filter-checkbox" value="${key}" ${isChecked ? 'checked' : ''}>
                    <span style="color: ${cat.color}">${cat.icon}</span>
                    <span>${cat.name}</span>
                `;

                div.querySelector('input').addEventListener('change', (e) => {
                    if (e.target.checked) {
                        if (!state.activeFilters.includes(key)) state.activeFilters.push(key);
                    } else {
                        state.activeFilters = state.activeFilters.filter(f => f !== key);
                    }
                    renderMarkers();
                    updateActiveFilterCount();
                });

                filterListEl.appendChild(div);
            });
            updateActiveFilterCount();
        }

        function updateActiveFilterCount() {
            const total = Object.keys(CONFIG.categories).length;
            const active = state.activeFilters.length;
            document.getElementById('active-count').textContent = `${active}/${total} active`;
        }

        /* ==========================================
           SIDEBAR & GALLERY LOGIC
           ========================================== */
        function selectLocation(id, zoomTo = true) {
            const loc = DATA.find(item => item.id === id);
            if (!loc) return;

            currentSelectedLocation = loc;
            state.selectedLocationId = id;

            if (loc.map !== state.currentMap) {
                switchMap(loc.map, false);
            }

            if (zoomTo) {
                const mapCfg = CONFIG.maps[loc.map];
                const lat = mapCfg.height - (loc.y / 100) * mapCfg.height;
                const lng = (loc.x / 100) * mapCfg.width;
                maps[loc.map].setView([lat, lng], 0, { animate: true, duration: 0.8 });
            }

            const catInfo = CONFIG.categories[loc.category];
            document.getElementById('sb-category').textContent = catInfo ? catInfo.name : loc.category;
            document.getElementById('sb-category').style.color = catInfo ? catInfo.color : 'var(--accent)';
            document.getElementById('sb-title').textContent = loc.title;
            document.getElementById('sb-description').textContent = loc.description;
            document.getElementById('sb-requirements').textContent = loc.requirements || 'Niciuna';
            document.getElementById('sb-rewards').textContent = loc.rewards || 'Standard';
            document.getElementById('sb-notes').textContent = loc.notes || 'Fără note suplimentare.';
            document.getElementById('sb-updated').textContent = `Modificat: ${loc.lastUpdated || '2026-07-25'}`;

            const favBtn = document.getElementById('sb-favorite-btn');
            if (state.favorites.includes(loc.id)) {
                favBtn.classList.add('favorited');
                favBtn.textContent = '★';
            } else {
                favBtn.classList.remove('favorited');
                favBtn.textContent = '⭐';
            }

            setupGallery(loc.images || []);
            document.getElementById('sidebar').classList.add('open');
            window.location.hash = loc.id;
        }

        function setupGallery(images) {
            activeGalleryIndex = 0;
            const container = document.getElementById('sb-gallery-container');
            
            container.querySelectorAll('.gallery-slide, .gallery-nav, .gallery-counter').forEach(el => el.remove());

            if (!images || images.length === 0) {
                images = ['image_6d67a5.jpg'];
            }

            images.forEach((imgSrc, index) => {
                const img = document.createElement('img');
                img.className = `gallery-slide ${index === 0 ? 'active' : ''}`;
                img.src = imgSrc;
                container.appendChild(img);
            });

            if (images.length > 1) {
                const prevBtn = document.createElement('button');
                prevBtn.className = 'gallery-nav gallery-prev';
                prevBtn.innerHTML = '❮';
                prevBtn.onclick = (e) => { e.stopPropagation(); changeSlide(-1, images.length); };

                const nextBtn = document.createElement('button');
                nextBtn.className = 'gallery-nav gallery-next';
                nextBtn.innerHTML = '❯';
                nextBtn.onclick = (e) => { e.stopPropagation(); changeSlide(1, images.length); };

                container.appendChild(prevBtn);
                container.appendChild(nextBtn);
            }

            const counter = document.createElement('div');
            counter.className = 'gallery-counter';
            counter.id = 'sb-gallery-counter';
            counter.textContent = `1 / ${images.length}`;
            container.appendChild(counter);
        }

        function changeSlide(direction, total) {
            const container = document.getElementById('sb-gallery-container');
            const slides = container.querySelectorAll('.gallery-slide');
            slides[activeGalleryIndex].classList.remove('active');

            activeGalleryIndex = (activeGalleryIndex + direction + total) % total;
            slides[activeGalleryIndex].classList.add('active');

            document.getElementById('sb-gallery-counter').textContent = `${activeGalleryIndex + 1} / ${total}`;
        }

        function openLightboxFromSidebar() {
            if (!currentSelectedLocation || !currentSelectedLocation.images) return;
            const imgSrc = currentSelectedLocation.images[activeGalleryIndex];
            openModal(imgSrc);
        }

        function openModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = imgSrc;
            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            state.selectedLocationId = null;
            history.pushState("", document.title, window.location.pathname + window.location.search);
        }

        /* ==========================================
           MAP TRANSITION ANIMATION & SWITCHING
           ========================================== */
        function switchMap(targetMapId, updateButtonText = true) {
            if (state.currentMap === targetMapId) return;

            const oldView = document.getElementById(`map-${state.currentMap}-view`);
            const newView = document.getElementById(`map-${targetMapId}-view`);

            oldView.classList.remove('active');
            setTimeout(() => {
                newView.classList.add('active');
                state.currentMap = targetMapId;
                
                setTimeout(() => {
                    maps[targetMapId].invalidateSize();
                }, 100);

                if (updateButtonText) {
                    const btn = document.getElementById('map-switch-btn');
                    btn.textContent = targetMapId === 'ls' ? 'Schimbă pe Cayo Perico' : 'Schimbă pe Los Santos';
                }

                localStorage.setItem('gta_guide_last_map', targetMapId);
            }, 300);
        }

        /* ==========================================
           SEARCH ENGINE & AUTOCOMPLETE
           ========================================== */
        function setupSearch() {
            const searchInput = document.getElementById('search-input');
            const resultsBox = document.getElementById('search-results');

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                if (!query) {
                    resultsBox.style.display = 'none';
                    return;
                }

                const matches = DATA.filter(item => 
                    item.title.toLowerCase().includes(query) || 
                    item.description.toLowerCase().includes(query) ||
                    item.category.toLowerCase().includes(query)
                );

                if (matches.length === 0) {
                    resultsBox.innerHTML = `<div class="search-result-item">Nicio locație găsită</div>`;
                    resultsBox.style.display = 'block';
                    return;
                }

                resultsBox.innerHTML = '';
                matches.forEach(match => {
                    const cat = CONFIG.categories[match.category];
                    const div = document.createElement('div');
                    div.className = 'search-result-item';
                    div.innerHTML = `
                        <span>${cat ? cat.icon : '📍'} ${match.title}</span>
                        <span style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">${match.map}</span>
                    `;
                    div.onclick = () => {
                        selectLocation(match.id);
                        resultsBox.style.display = 'none';
                        searchInput.value = '';
                    };
                    resultsBox.appendChild(div);
                });
                resultsBox.style.display = 'block';
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-container')) {
                    resultsBox.style.display = 'none';
                }
            });
        }

        /* ==========================================
           UTILITIES & EVENT LISTENERS
           ========================================== */
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function setupEventListeners() {
            document.getElementById('map-switch-btn').addEventListener('click', () => {
                const nextMap = state.currentMap === 'ls' ? 'cayo' : 'ls';
                switchMap(nextMap);
            });

            document.getElementById('sb-close-btn').addEventListener('click', closeSidebar);

            document.getElementById('sb-favorite-btn').addEventListener('click', () => {
                if (!currentSelectedLocation) return;
                const id = currentSelectedLocation.id;
                const index = state.favorites.indexOf(id);
                const favBtn = document.getElementById('sb-favorite-btn');

                if (index > -1) {
                    state.favorites.splice(index, 1);
                    favBtn.classList.remove('favorited');
                    favBtn.textContent = '⭐';
                    showToast('Eliminat din favorite');
                } else {
                    state.favorites.push(id);
                    favBtn.classList.add('favorited');
                    favBtn.textContent = '★';
                    showToast('Adăugat la favorite');
                }
                localStorage.setItem('gta_guide_favorites', JSON.stringify(state.favorites));
            });

            document.getElementById('sb-copy-btn').addEventListener('click', () => {
                if (!currentSelectedLocation) return;
                const text = `${currentSelectedLocation.title} (${currentSelectedLocation.category.toUpperCase()}) - Harta: ${currentSelectedLocation.map.toUpperCase()} [X: ${currentSelectedLocation.x}%, Y: ${currentSelectedLocation.y}%] - Familia Es Todo`;
                navigator.clipboard.writeText(text).then(() => {
                    showToast('Informațiile au fost copiate!');
                });
            });

            document.getElementById('theme-toggle-btn').addEventListener('click', () => {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', state.theme);
                localStorage.setItem('gta_guide_theme', state.theme);
                showToast(`Modul ${state.theme === 'dark' ? 'Întunecat' : 'Luminos'} activat`);
            });

            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                    closeSidebar();
                }
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    const searchInput = document.getElementById('search-input');
                    if (searchInput) searchInput.focus();
                }
                if (e.key.toLowerCase() === 'm' && document.activeElement.tagName !== 'INPUT') {
                    const nextMap = state.currentMap === 'ls' ? 'cayo' : 'ls';
                    switchMap(nextMap);
                }
                if (document.getElementById('sidebar').classList.contains('open') && currentSelectedLocation && currentSelectedLocation.images) {
                    const totalImages = currentSelectedLocation.images.length;
                    if (totalImages > 1) {
                        if (e.key === 'ArrowLeft') changeSlide(-1, totalImages);
                        if (e.key === 'ArrowRight') changeSlide(1, totalImages);
                    }
                }
            });

            setupSearch();
        }

        function checkUrlHashOnLoad() {
            const hash = window.location.hash.replace('#', '');
            if (hash) {
                const match = DATA.find(item => item.id === hash);
                if (match) {
                    setTimeout(() => {
                        selectLocation(match.id);
                    }, 500);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', initMaps);
    </script>
